<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kat Görevlisi Paneli | Sahra Apart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .status-CLEANING_REQUIRED { background-color: #fefce8; color: #854d0e; border: 2px solid #fef08a; }
        .status-AVAILABLE { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status-OCCUPIED { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .status-RESERVED { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Toast Bildirimleri -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 transform -translate-y-20 opacity-0 transition-all duration-300 z-[9999]">
        <div class="bg-slate-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700">
            <span id="toastIconWrapper"></span>
            <span id="toastMsg" class="font-medium text-sm">İşlem başarılı</span>
        </div>
    </div>

    <!-- Topbar -->
    <header class="bg-slate-900 text-white h-16 flex items-center justify-between px-4 sm:px-8 shrink-0 shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold">KG</div>
            <div>
                <h1 class="text-base font-bold tracking-wide">Kat Görevlisi Paneli</h1>
                <p class="text-[10px] text-slate-400" id="staffNameDisplay">Yükleniyor...</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="logoutApp()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-xs font-semibold transition border border-red-500/20">
                <i data-lucide="log-out" class="w-4 h-4"></i> Çıkış
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8">
        <div class="max-w-6xl mx-auto space-y-6">
            
            <!-- Bilgilendirme Kartı -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">Oda Temizlik Durumları</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Müşterisi çıkış yapmış ve temizlik bekleyen odaları aşağıda görebilir, temizliği bitince tek tıkla müsait konuma getirebilirsiniz.</p>
                </div>
                <div class="flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-800 px-3 py-1.5 rounded-xl text-xs font-bold">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span>Temizlik Bekleyen: <span id="cleaningCount">0</span> Oda</span>
                </div>
            </div>

            <!-- Odalar Grid -->
            <div id="housekeepingRoomsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="col-span-full text-center py-16 text-slate-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-amber-500"></i>
                    Odalar yükleniyor...
                </div>
            </div>

        </div>
    </main>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBL0xJ2-BS9o5QgG4AMb-s_xvt-Ai6nDm0",
            authDomain: "ekorkonaklama-web.firebaseapp.com",
            projectId: "ekorkonaklama-web",
            storageBucket: "ekorkonaklama-web.firebasestorage.app",
            messagingSenderId: "485785040258",
            appId: "1:485785040258:web:96e201063459beed388b9b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        lucide.createIcons();

        let allApartments = [];
        let allRooms = [];

        // Yetki Kontrolü
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.assign('login.html');
            } else {
                if(user.email) {
                    const q = query(collection(db, "staff"), where("email", "==", user.email));
                    const snap = await getDocs(q);
                    
                    if(!snap.empty) {
                        const staffData = snap.docs[0].data();
                        const role = staffData.role;
                        
                        document.getElementById('staffNameDisplay').textContent = staffData.name || 'Kat Görevlisi';

                        if(role !== 'HOUSEKEEPING' && role !== 'ADMIN') {
                            alert("Bu sayfaya erişim yetkiniz yok.");
                            window.location.assign('login.html');
                        } else {
                            listenToData();
                        }
                    } else if (user.email === 'admin@sahra.com' || window.location.hostname === 'localhost') {
                        document.getElementById('staffNameDisplay').textContent = 'Sistem Yöneticisi';
                        listenToData();
                    } else {
                        alert("Kullanıcı kaydı bulunamadı.");
                        window.location.assign('login.html');
                    }
                } else { listenToData(); }
            }
        });

        window.logoutApp = () => { signOut(auth).then(() => window.location.assign('login.html')); };

        function listenToData() {
            onSnapshot(collection(db, "apartments"), (snap) => {
                allApartments = []; snap.forEach(d => allApartments.push({ id: d.id, ...d.data() }));
                renderRooms();
            });

            onSnapshot(collection(db, "rooms"), (snap) => {
                allRooms = []; snap.forEach(d => allRooms.push({ id: d.id, ...d.data() }));
                renderRooms();
            });
        }

        function renderRooms() {
            const grid = document.getElementById('housekeepingRoomsGrid');
            if(allRooms.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Kayıtlı oda bulunmuyor.</div>`;
                return;
            }

            let cleaningCount = 0;
            let html = '';

            // Temizlik bekleyenleri en üste getirmek için sıralayalım
            const sortedRooms = [...allRooms].sort((a, b) => {
                if (a.status === 'CLEANING_REQUIRED' && b.status !== 'CLEANING_REQUIRED') return -1;
                if (a.status !== 'CLEANING_REQUIRED' && b.status === 'CLEANING_REQUIRED') return 1;
                return a.roomNumber.localeCompare(b.roomNumber);
            });

            sortedRooms.forEach(room => {
                const apt = allApartments.find(a => a.id === room.apartmentId);
                const aptName = apt ? apt.name : 'Apart';
                
                if (room.status === 'CLEANING_REQUIRED') cleaningCount++;

                let actionBtn = '';
                if (room.status === 'CLEANING_REQUIRED') {
                    actionBtn = `<button onclick="markAsClean('${room.id}', '${room.roomNumber}')" class="w-full mt-3 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-1.5">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> Temizlendi (Müsait Yap)
                    </button>`;
                } else {
                    actionBtn = `<div class="mt-3 text-center text-[11px] font-semibold opacity-60 uppercase tracking-wider py-1">${getStatusText(room.status)}</div>`;
                }

                html += `
                    <div class="status-${room.status} rounded-2xl p-5 shadow-sm flex flex-col justify-between transition-all">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-2xl font-black tracking-tight">${room.roomNumber}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/80 shadow-sm">${aptName}</span>
                            </div>
                            <p class="text-xs font-medium opacity-80">${room.type || 'Standart Daire'}</p>
                        </div>
                        <div>
                            ${actionBtn}
                        </div>
                    </div>
                `;
            });

            document.getElementById('cleaningCount').textContent = cleaningCount;
            grid.innerHTML = html;
            lucide.createIcons();
        }

        function getStatusText(status) {
            const map = {
                'AVAILABLE': 'Müsait Durumda',
                'RESERVED': 'Rezerve Edilmiş',
                'OCCUPIED': 'İçerisinde Müşteri Var',
                'CLEANING_REQUIRED': '⚠️ Temizlik Bekliyor',
                'MAINTENANCE': 'Bakım / Arızalı'
            };
            return map[status] || status;
        }

        // Temizlendi Butonu (Odayı tekrar Müsait yapar)
        window.markAsClean = async (roomId, roomNo) => {
            if(!confirm(`Oda ${roomNo} temizlendi olarak işaretlenip tekrar 'Müsait' duruma getirilsin mi?`)) return;
            try {
                await updateDoc(doc(db, "rooms", roomId), { status: 'AVAILABLE' });
                showToast(`Oda ${roomNo} temizlendi ve satışa açıldı.`);
            } catch(e) {
                showToast("İşlem sırasında hata oluştu.", "error");
            }
        };

        window.showToast = (msg, type = 'success') => {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            const wrapper = document.getElementById('toastIconWrapper');
            wrapper.innerHTML = `<i data-lucide="${type==='error'?'alert-circle':'check-circle'}" class="w-5 h-5 ${type==='error'?'text-red-400':'text-emerald-400'}"></i>`;
            lucide.createIcons();
            t.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('-translate-y-20', 'opacity-0'), 3000);
        };
    </script>
</body>
</html>
