<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resepsiyon Paneli | Sahra Apart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .status-AVAILABLE { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status-RESERVED { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .status-OCCUPIED { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .status-CLEANING_REQUIRED { background-color: #fefce8; color: #854d0e; border: 1px solid #fef08a; }
        .status-MAINTENANCE { background-color: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }

        /* Kaydırma çubuğu gizleme */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Mobile Header -->
    <header class="md:hidden bg-slate-900 text-white h-16 flex items-center justify-between px-4 shrink-0 z-20 shadow-md">
        <h1 class="text-lg font-bold tracking-wider text-blue-400">SAHRA APART</h1>
        <button onclick="toggleSidebar()" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </header>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/60 z-30 hidden backdrop-blur-sm md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-40 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl md:shadow-none">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center md:block">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-bold tracking-wider text-blue-400 hidden md:block">SAHRA</h1>
                <p class="text-[10px] text-slate-400 uppercase mt-1 tracking-widest hidden md:block">RESEPSİYON PANELİ</p>
            </div>
            <button class="md:hidden text-slate-400 hover:text-white" onclick="toggleSidebar()"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="switchTab('map')" id="tab-map" class="w-full flex items-center gap-3 px-4 py-3.5 bg-blue-600 rounded-xl text-white font-medium transition text-left shadow-lg shadow-blue-600/20">
                <i data-lucide="layout-grid" class="w-5 h-5"></i> Oda Haritası
            </button>
            <button onclick="switchTab('reservations')" id="tab-reservations" class="w-full flex items-center justify-between px-4 py-3.5 text-slate-300 hover:bg-slate-800 hover:text-white rounded-xl transition text-left">
                <div class="flex items-center gap-3"><i data-lucide="calendar-days" class="w-5 h-5"></i> Rezervasyonlar</div>
                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full" id="resCountBadge">0</span>
            </button>
        </nav>
        <div class="p-4 border-t border-slate-800 bg-slate-950/50">
            <div class="flex items-center gap-3 px-2 py-2 mb-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center shrink-0">
                    <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-white">Resepsiyon</p>
                    <p class="text-[10px] text-emerald-400 font-medium tracking-wider flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Çevrimiçi</p>
                </div>
            </div>
            <a href="login.html" class="flex items-center justify-center gap-2 w-full px-4 py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm font-semibold rounded-xl transition border border-red-500/20">
                <i data-lucide="log-out" class="w-4 h-4"></i> Çıkış Yap
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-[calc(100vh-4rem)] md:h-screen overflow-hidden bg-slate-50/50">
        <!-- Top Actions Bar -->
        <header class="bg-white h-16 border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 shrink-0 shadow-sm z-10">
            <h2 class="text-lg md:text-xl font-bold text-slate-800 hidden sm:block" id="pageTitle">Oda Haritası</h2>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="openFinanceModal()" class="flex-1 sm:flex-none flex justify-center items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 md:px-4 py-2 md:py-2.5 rounded-xl font-medium transition text-sm md:text-base border border-slate-200">
                    <i data-lucide="receipt" class="w-4 h-4 text-slate-500"></i> Kasa Gideri
                </button>
                <button onclick="openReservationModal()" class="flex-1 sm:flex-none flex justify-center items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 md:px-4 py-2 md:py-2.5 rounded-xl font-bold transition shadow-lg shadow-blue-600/20 text-sm md:text-base">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Rezervasyon
                </button>
            </div>
        </header>

        <!-- Stats Bar (Scrollable on mobile) -->
        <div class="bg-white border-b border-slate-200 p-3 shrink-0 overflow-x-auto whitespace-nowrap hidden sm:block" id="statsBar">
            <div class="flex gap-3 min-w-max px-2">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg shadow-sm">
                    <span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span></span>
                    <span class="text-xs font-bold tracking-wide uppercase">Müsait: <span id="statAvailable" class="text-sm">0</span></span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1.5 bg-blue-50 text-blue-800 border border-blue-200 rounded-lg shadow-sm">
                    <div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div>
                    <span class="text-xs font-bold tracking-wide uppercase">Rezerve: <span id="statReserved" class="text-sm">0</span></span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1.5 bg-red-50 text-red-800 border border-red-200 rounded-lg shadow-sm">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                    <span class="text-xs font-bold tracking-wide uppercase">Dolu: <span id="statOccupied" class="text-sm">0</span></span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-lg shadow-sm">
                    <div class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
                    <span class="text-xs font-bold tracking-wide uppercase">Temizlik: <span id="statCleaning" class="text-sm">0</span></span>
                </div>
            </div>
        </div>

        <!-- CONTENT 1: ROOM MAP -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6" id="view-map">
            <div id="roomMapContainer" class="pb-10">
                <div class="flex flex-col items-center justify-center h-full text-slate-400 mt-20">
                    <i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-3 text-blue-500"></i>
                    <p class="font-medium">Oda haritası yükleniyor...</p>
                </div>
            </div>
        </div>

        <!-- CONTENT 2: RESERVATIONS LIST -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6 hidden" id="view-reservations">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-slate-50 shrink-0">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2 shrink-0">
                        <i data-lucide="calendar-clock" class="w-5 h-5 text-blue-500"></i> Rezervasyon Listesi
                    </h3>
                    
                    <!-- FİLTRELEME BUTONLARI -->
                    <div class="flex bg-slate-200/70 p-1 rounded-lg w-full xl:w-auto text-xs font-bold overflow-x-auto shrink-0">
                        <button onclick="filterReservations('ALL')" id="res-filter-ALL" class="flex-1 sm:px-4 px-3 py-2 bg-white text-slate-800 shadow-sm rounded-md transition whitespace-nowrap">Tümü</button>
                        <button onclick="filterReservations('CONFIRMED')" id="res-filter-CONFIRMED" class="flex-1 sm:px-4 px-3 py-2 text-slate-500 hover:text-slate-800 rounded-md transition whitespace-nowrap">Giriş Bekleyen</button>
                        <button onclick="filterReservations('CHECKED_IN')" id="res-filter-CHECKED_IN" class="flex-1 sm:px-4 px-3 py-2 text-slate-500 hover:text-slate-800 rounded-md transition whitespace-nowrap">Konaklayan (İçeride)</button>
                        <button onclick="filterReservations('CHECKED_OUT')" id="res-filter-CHECKED_OUT" class="flex-1 sm:px-4 px-3 py-2 text-slate-500 hover:text-slate-800 rounded-md transition whitespace-nowrap">Geçmiş (Çıkış)</button>
                    </div>
                </div>
                <div class="overflow-x-auto flex-1">
                                <th class="p-4">Bakiye Durumu</th>
                                <th class="p-4 text-right">Durum</th>
                            </tr>
                        </thead>
                        <tbody id="reservationsTableBody" class="divide-y divide-slate-100">
                            <!-- JS ile doldurulacak -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Room Action Modal -->
    <div id="roomModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl w-full max-w-md modal-enter overflow-hidden flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between p-5 border-b border-slate-100 bg-slate-50 shrink-0">
                <div>
                    <h3 class="text-2xl font-bold text-slate-900" id="modalRoomName">Oda 101</h3>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider" id="modalRoomType">Standart Oda</p>
                </div>
                <button onclick="closeRoomModal()" class="w-8 h-8 flex items-center justify-center bg-white rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 shadow-sm border border-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-5 space-y-5 overflow-y-auto flex-1">
                <div class="p-4 rounded-2xl border-2 flex items-center gap-4 shadow-sm" id="modalStatusBadge">
                    <!-- Status HTML -->
                </div>
                <div id="modalActionButtons" class="grid grid-cols-1 gap-3 pt-2">
                    <!-- Action Buttons -->
                </div>
            </div>
        </div>
    </div>

    <!-- Hızlı Rezervasyon Modalı (Bakiye / Kapora Destekli) -->
    <div id="reservationModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl w-full max-w-2xl modal-enter flex flex-col h-[90vh] sm:h-auto sm:max-h-[90vh] overflow-hidden">
            <div class="flex items-center justify-between p-4 sm:p-5 border-b border-gray-100 bg-slate-50 shrink-0">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2"><i data-lucide="calendar-plus" class="w-5 h-5 text-blue-600"></i> Yeni Rezervasyon</h3>
                <button onclick="closeReservationModal()" class="w-8 h-8 flex items-center justify-center bg-white rounded-full text-slate-400 hover:text-slate-600 shadow-sm border border-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-4 sm:p-5 overflow-y-auto flex-1 custom-scrollbar">
                <form id="reservationForm" class="space-y-5">
                    
                    <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Müşteri Adı Soyadı *</label>
                                <input type="text" id="resName" required class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3 bg-white border outline-none text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Telefon *</label>
                                <input type="tel" id="resPhone" required class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3 bg-white border outline-none text-slate-800">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">TC Kimlik / Pasaport</label>
                                <input type="text" id="resTC" class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3 bg-white border outline-none text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Kişi Sayısı</label>
                                <input type="number" id="resGuests" min="1" value="2" required class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3 bg-white border outline-none text-slate-800">
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Oda Seçimi *</label>
                            <select id="resRoom" required class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3.5 bg-white border outline-none text-slate-800 font-medium">
                                <option value="">Önce oda seçin...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Giriş Tarihi *</label>
                            <input type="date" id="resCheckIn" required class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3 bg-white border outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Çıkış Tarihi *</label>
                            <input type="date" id="resCheckOut" required class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3 bg-white border outline-none">
                        </div>
                    </div>

                    <!-- FİNANS BÖLÜMÜ (KAPORA VE KALAN) -->
                    <div class="bg-emerald-50/50 p-4 rounded-2xl border border-emerald-100 space-y-4">
                        <div class="pt-2">
                            <label class="block text-sm font-bold text-slate-700 mb-1">Toplam Konaklama Tutarı</label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-slate-400">₺</span>
                                <input type="number" id="resPrice" required class="w-full pl-8 pr-4 py-3.5 border-slate-300 rounded-xl shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-white border-2 outline-none text-xl font-bold text-slate-900 transition-colors">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-emerald-700 uppercase mb-1">Şimdi Alınan Kapora (₺)</label>
                                <input type="number" id="resDeposit" value="0" min="0" required class="w-full p-3 border-emerald-200 rounded-xl shadow-sm focus:ring-emerald-500 bg-white border-2 outline-none text-lg font-bold text-emerald-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-red-700 uppercase mb-1">Kalan Bakiye (₺)</label>
                                <input type="number" id="resRemaining" value="0" readonly class="w-full p-3 border-red-200 rounded-xl shadow-sm bg-red-50/50 border-2 outline-none text-lg font-bold text-red-900 cursor-not-allowed">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="p-4 sm:p-5 border-t border-slate-100 bg-white shrink-0 flex gap-3">
                <button onclick="closeReservationModal()" class="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 rounded-xl transition">İptal</button>
                <button onclick="submitReservation(event)" class="flex-[2] py-3.5 bg-blue-600 text-white font-bold hover:bg-blue-700 rounded-xl transition shadow-lg shadow-blue-600/30">Kaydet ve Onayla</button>
            </div>
        </div>
    </div>

    <!-- Kasa Gideri Ekleme Modalı -->
    <div id="financeModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl w-full max-w-md modal-enter overflow-hidden">
            <div class="flex items-center justify-between p-5 border-b border-slate-100 bg-slate-50">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2"><i data-lucide="receipt" class="w-5 h-5 text-slate-500"></i> Kasa Gideri Ekle</h3>
                <button onclick="closeFinanceModal()" class="w-8 h-8 flex items-center justify-center bg-white rounded-full text-slate-400 hover:text-slate-600 shadow-sm border border-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5">
                <form id="financeForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Harcama Kategorisi</label>
                        <select id="finCategory" required class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 p-3 bg-white border outline-none">
                            <option value="SUPPLIES">Temizlik / Sarf Malzemesi</option>
                            <option value="BILLS">Fatura / Abonelik</option>
                            <option value="MAINTENANCE">Bakım / Onarım</option>
                            <option value="OTHER">Diğer</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Açıklama</label>
                        <input type="text" id="finDesc" required placeholder="Örn: 2 adet deterjan" class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 p-3 bg-white border outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Tutar (₺)</label>
                        <input type="number" id="finAmount" required placeholder="150" class="w-full border-slate-200 rounded-xl shadow-sm focus:ring-blue-500 p-3 bg-white border outline-none font-bold text-red-600">
                    </div>
                    <button type="submit" class="w-full mt-4 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                        <i data-lucide="minus-circle" class="w-5 h-5 text-red-400"></i> Gider Olarak İşle
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 transform -translate-y-20 opacity-0 transition-all duration-300 z-[9999]">
        <div class="bg-slate-900/95 backdrop-blur text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700">
            <i data-lucide="check-circle" id="toastIcon" class="w-5 h-5 text-emerald-400"></i>
            <span id="toastMsg" class="font-medium text-sm">İşlem başarılı</span>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, serverTimestamp, query, orderBy, getDocs, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBL0xJ2-BS9o5QgG4AMb-s_xvt-Ai6nDm0",
            authDomain: "ekorkonaklama-web.firebaseapp.com",
            projectId: "ekorkonaklama-web",
            storageBucket: "ekorkonaklama-web.firebasestorage.app",
            messagingSenderId: "485785040258",
            appId: "1:485785040258:web:96e201063459beed388b9b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        lucide.createIcons();

        // ----------------------------------------------------------------
        // GÜVENLİK (ROUTE GUARD) & Auth Control
        // ----------------------------------------------------------------
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                if(window.location.pathname.endsWith('resepsiyon.html')) { window.location.assign('login.html'); }
            } else {
                if(user.email) {
                    const q = query(collection(db, "staff"), where("email", "==", user.email));
                    const snap = await getDocs(q);
                    if(!snap.empty) {
                        const role = snap.docs[0].data().role;
                        if(role !== 'RECEPTION' && role !== 'ADMIN') {
                            alert("Bu sayfaya erişim yetkiniz yok.");
                            window.location.assign('login.html');
                        } else { listenToData(); } // Verileri yükle
                    } else if (user.email === 'admin@sahra.com' || window.location.hostname === 'localhost') {
                        listenToData(); // Admin bypass or local dev
                    }
                } else { listenToData(); }
            }
        });

        // ----------------------------------------------------------------
        // GLOBAL STATE & DATA LISTENING
        // ----------------------------------------------------------------
        let allApartments = [];
        let allRooms = [];
        let currentSelectedRoom = null;
        let allReservations = []; // YENİ
        let currentResFilter = 'ALL'; // YENİ

        function listenToData() {
            onSnapshot(collection(db, "apartments"), (snap) => {
                allApartments = []; snap.forEach(d => allApartments.push({ id: d.id, ...d.data() })); renderRoomMap();
            });

            onSnapshot(collection(db, "rooms"), (snap) => {
                allRooms = [];
                let s = { AVAILABLE: 0, RESERVED: 0, OCCUPIED: 0, CLEANING_REQUIRED: 0, MAINTENANCE: 0 };
                snap.forEach(d => {
                    const room = { id: d.id, ...d.data() };
                    allRooms.push(room);
                    if(s[room.status] !== undefined) s[room.status]++;
                });
                
                document.getElementById('statAvailable').textContent = s.AVAILABLE;
                document.getElementById('statReserved').textContent = s.RESERVED;
                document.getElementById('statOccupied').textContent = s.OCCUPIED;
                document.getElementById('statCleaning').textContent = s.CLEANING_REQUIRED;
                
                renderRoomMap(); populateReservationRoomSelect();
            });

            // YENİ: REZERVASYONLARI DİNLE VE LİSTELE
            const qRes = query(collection(db, "reservations"), orderBy("createdAt", "desc"));
            onSnapshot(qRes, (snapshot) => {
                allReservations = [];
                snapshot.forEach(d => allReservations.push({ id: d.id, ...d.data() }));
                
                // Aktif (Bekleyen + Konaklayan) sayısını menüdeki mavi rozete yaz
                const activeCount = allReservations.filter(r => r.status === 'CONFIRMED' || r.status === 'CHECKED_IN').length;
                document.getElementById('resCountBadge').textContent = activeCount;
                
                renderReservations();
            });
        }

        // FİLTRELEME VE EKRANA ÇİZME FONKSİYONLARI
        window.filterReservations = (status) => {
            currentResFilter = status;
            ['ALL', 'CONFIRMED', 'CHECKED_IN', 'CHECKED_OUT'].forEach(f => {
                const btn = document.getElementById(`res-filter-${f}`);
                if(!btn) return;
                if (f === status) {
                    btn.className = "flex-1 sm:px-4 px-3 py-2 bg-white text-slate-800 shadow-sm rounded-md transition whitespace-nowrap";
                } else {
                    btn.className = "flex-1 sm:px-4 px-3 py-2 text-slate-500 hover:text-slate-800 rounded-md transition whitespace-nowrap";
                }
            });
            renderReservations();
        };

        function renderReservations() {
            let html = '';
            
            // Seçili filtreye göre veriyi süz
            let filtered = allReservations;
            if (currentResFilter !== 'ALL') {
                filtered = allReservations.filter(r => r.status === currentResFilter);
            }

            filtered.forEach(r => {
                const room = allRooms.find(rm => rm.id === r.roomId);
                const roomNo = room ? room.roomNumber : '?';
                const aptName = room ? (allApartments.find(a => a.id === room.apartmentId)?.name || '') : '';
                
                const fullName = r.customerName || '';
                const dateAdded = r.createdAt ? new Date(r.createdAt.toMillis()).toLocaleDateString('tr-TR') : '-';

                const totalP = r.totalPrice || 0;
                const paidP = r.paidAmount || 0;
                const remP = r.remainingAmount || 0;

                let balanceHtml = `
                    <p class="font-bold text-slate-800 text-sm">₺${totalP}</p>
                    <p class="text-[10px] text-emerald-600 font-bold uppercase mt-0.5">Ödenen: ₺${paidP}</p>
                `;
                
                if (remP > 0) {
                    balanceHtml += `
                        <p class="text-[10px] text-red-600 font-bold uppercase mt-0.5">Kalan: ₺${remP}</p>
                        <button onclick="collectRemaining('${r.id}', ${remP}, ${totalP}, '${fullName}', '${roomNo}')" class="mt-1.5 px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg text-[10px] font-bold border border-emerald-200 transition shadow-sm w-full">Kalanı Tahsil Et</button>
                    `;
                } else {
                    balanceHtml += `<div class="mt-1.5 px-2 py-1 bg-slate-100 text-slate-400 rounded text-[9px] font-bold border border-slate-200 uppercase text-center w-max">HESAP KAPANDI</div>`;
                }

                // Durum Renklendirme ve Aksiyon Butonları
                let badgeColor = '';
                let statusLabel = '';
                let actionBtnHtml = '';

                if (r.status === 'CONFIRMED') {
                    badgeColor = 'bg-blue-50 text-blue-700 border-blue-200';
                    statusLabel = 'GİRİŞ BEKLİYOR';
                    actionBtnHtml = `<button onclick="checkinGuest('${r.id}', '${r.roomId}', '${fullName}')" class="mt-2 w-full px-2 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-[10px] font-bold transition shadow-sm flex items-center justify-center gap-1"><i data-lucide="log-in" class="w-4 h-4"></i> GİRİŞ YAP (Check-in)</button>`;
                } 
                else if (r.status === 'CHECKED_IN') {
                    badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                    statusLabel = 'KONAKLIYOR';
                    actionBtnHtml = `<button onclick="checkoutGuest('${r.id}', '${r.roomId}', ${remP}, '${fullName}')" class="mt-2 w-full px-2 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-[10px] font-bold transition shadow-sm flex items-center justify-center gap-1"><i data-lucide="log-out" class="w-4 h-4"></i> ÇIKIŞ YAP (Check-out)</button>`;
                } 
                else if (r.status === 'CHECKED_OUT') {
                    badgeColor = 'bg-slate-100 text-slate-500 border-slate-200';
                    statusLabel = 'ÇIKIŞ YAPTI';
                    actionBtnHtml = ``; // Geçmiş rezervasyonda buton yok
                }
                else {
                    badgeColor = 'bg-red-50 text-red-700 border-red-200';
                    statusLabel = r.status;
                }

                html += `
                    <tr class="hover:bg-slate-50/50 transition border-b border-slate-50">
                        <td class="p-4 text-[11px] text-slate-500 whitespace-nowrap">${dateAdded}</td>
                        <td class="p-4 font-bold text-slate-800">${fullName}</td>
                        <td class="p-4">
                            <p class="text-xs font-semibold text-slate-700">${r.phone || '-'}</p>
                            <p class="text-[10px] text-slate-400 mt-0.5">TC: ${r.tc || '-'}</p>
                        </td>
                        <td class="p-4">
                            <p class="font-bold text-blue-600 text-sm">Oda ${roomNo}</p>
                            <p class="text-[10px] text-slate-500 truncate max-w-[120px] mt-0.5">${aptName}</p>
                        </td>
                        <td class="p-4 text-xs whitespace-nowrap">
                            <p class="mb-1"><span class="text-slate-400 text-[10px]">G:</span> <strong class="text-emerald-700">${r.checkInDate || '-'}</strong></p>
                            <p><span class="text-slate-400 text-[10px]">Ç:</span> <strong class="text-red-700">${r.checkOutDate || '-'}</strong></p>
                        </td>
                        <td class="p-4">${balanceHtml}</td>
                        <td class="p-4 text-right">
                            <div class="flex flex-col items-end w-[130px]">
                                <span class="px-2.5 py-1 ${badgeColor} rounded-md text-[10px] font-bold border uppercase tracking-wider inline-block w-full text-center">${statusLabel}</span>
                                ${actionBtnHtml}
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            document.getElementById('reservationsTableBody').innerHTML = html || '<tr><td colspan="7" class="p-8 text-center text-slate-400">Bu kategoride rezervasyon bulunmuyor.</td></tr>';
            lucide.createIcons();
        }

        // Bakiye (Kalan) Tahsilat Fonksiyonu
        window.collectRemaining = async (resId, amount, totalAmount, name, roomNo) => {
            if(!confirm(`${name} adlı müşteriden kalan ₺${amount} tutarı tahsil edip kasaya işlemek istediğinize emin misiniz?`)) return;
            
            try {
                // 1. Kasaya Gelir Ekle
                await addDoc(collection(db, "finances"), {
                    type: 'INCOME',
                    category: 'RESERVATION',
                    amount: amount,
                    description: `${name} - Oda ${roomNo} (Kalan Bakiye Tahsilatı)`,
                    addedBy: 'RECEPTION',
                    createdAt: serverTimestamp()
                });

                // 2. Rezervasyon Bakiyesini Sıfırla
                await updateDoc(doc(db, "reservations", resId), {
                    remainingAmount: 0,
                    paidAmount: totalAmount
                });
                
                showToast("Kalan bakiye tahsil edildi ve kasaya eklendi!");
            } catch(e) { console.error(e); showToast("Tahsilat hatası.", "error"); }
        };

        // YENİ: Müşteri Girişi (Check-in)
        window.checkinGuest = async (resId, roomId, name) => {
            if(!confirm(`${name} adlı müşterinin otele girişini (Check-in) yapmak istediğinize emin misiniz?`)) return;

            try {
                // 1. Rezervasyonu İçeride (CHECKED_IN) yap
                await updateDoc(doc(db, "reservations", resId), { status: 'CHECKED_IN' });
                
                // 2. Odayı kırmızı renge (OCCUPIED) çevir
                if (roomId) {
                    await updateDoc(doc(db, "rooms", roomId), { status: 'OCCUPIED' });
                }
                
                showToast("Giriş işlemi başarılı. Oda 'Dolu' olarak güncellendi.");
            } catch (e) {
                console.error(e);
                showToast("Giriş işlemi sırasında hata oluştu.", "error");
            }
        };

        // YENİ: Tek Tıkla Müşteri Çıkışı (Check-out) ve Güvenlik Kontrolü
        window.checkoutGuest = async (resId, roomId, remainingAmount, name) => {
            if (remainingAmount > 0) {
                showToast(`${name} isimli müşterinin ödenmemiş bakiyesi var. Lütfen önce "Kalanı Tahsil Et" butonuna basarak hesabı kapatın!`, "error");
                return;
            }
            
            if(!confirm(`${name} adlı müşterinin otelden çıkışını yapmak ve odayı temizlik listesine göndermek istediğinize emin misiniz?`)) return;

            try {
                // 1. Rezervasyonu geçmiş kayıt olarak (CHECKED_OUT) kapat
                await updateDoc(doc(db, "reservations", resId), { status: 'CHECKED_OUT' });
                
                // 2. Odayı sarı renge (CLEANING_REQUIRED) çevir ve kat görevlisine yolla
                if (roomId) {
                    await updateDoc(doc(db, "rooms", roomId), { status: 'CLEANING_REQUIRED' });
                }
                
                showToast("Çıkış işlemi başarılı. Oda otomatik olarak temizliğe gönderildi.");
            } catch (e) {
                console.error(e);
                showToast("Çıkış işlemi sırasında bir hata oluştu.", "error");
            }
        };

        // ----------------------------------------------------------------
        // UI & RENDERING
        // ----------------------------------------------------------------
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        };

        window.switchTab = (tab) => {
            document.getElementById('view-map').classList.add('hidden');
            document.getElementById('view-reservations').classList.add('hidden');
            document.getElementById('tab-map').className = "w-full flex items-center gap-3 px-4 py-3.5 text-slate-300 hover:bg-slate-800 hover:text-white rounded-xl transition text-left";
            document.getElementById('tab-reservations').className = "w-full flex items-center justify-between px-4 py-3.5 text-slate-300 hover:bg-slate-800 hover:text-white rounded-xl transition text-left";
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            if(tab === 'map') {
                document.getElementById('pageTitle').textContent = "Oda Haritası";
                document.getElementById('statsBar').classList.remove('hidden');
                document.getElementById('tab-map').className = "w-full flex items-center gap-3 px-4 py-3.5 bg-blue-600 rounded-xl text-white font-medium transition text-left shadow-lg shadow-blue-600/20";
            } else {
                document.getElementById('pageTitle').textContent = "Rezervasyonlar";
                document.getElementById('statsBar').classList.add('hidden');
                document.getElementById('tab-reservations').className = "w-full flex items-center justify-between px-4 py-3.5 bg-blue-600 rounded-xl text-white font-medium transition text-left shadow-lg shadow-blue-600/20";
            }
            if(window.innerWidth < 768) toggleSidebar(); // Mobilde menüyü kapat
        };

        function renderRoomMap() {
            const container = document.getElementById('roomMapContainer');
            if (allApartments.length === 0 || allRooms.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">Veri bulunamadı.</div>`; return;
            }

            let html = '';
            allApartments.forEach(apt => {
                const aptRooms = allRooms.filter(r => r.apartmentId === apt.id).sort((a,b) => a.roomNumber.localeCompare(b.roomNumber));
                if(aptRooms.length > 0) {
                    html += `<div class="mb-8">
                        <h3 class="text-sm font-bold text-slate-500 mb-4 border-b border-slate-200 pb-2 uppercase tracking-wider flex items-center gap-2"><i data-lucide="building-2" class="w-4 h-4"></i> ${apt.name}</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 md:gap-4">`;
                    
                    aptRooms.forEach(room => {
                        html += `
                        <div onclick="window.openRoomDetails('${room.id}')" class="status-${room.status} rounded-2xl p-4 cursor-pointer hover:scale-[1.02] active:scale-95 transition-all flex flex-col justify-between aspect-square shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-2xl tracking-tighter">${room.roomNumber}</span>
                                <i data-lucide="${getIconForStatus(room.status)}" class="w-5 h-5 opacity-70"></i>
                            </div>
                            <div>
                                <p class="text-[10px] opacity-70 mb-1 font-bold tracking-wider uppercase truncate">${room.type}</p>
                                <p class="text-xs font-bold leading-tight">${getStatusLabel(room.status)}</p>
                            </div>
                        </div>`;
                    });
                    html += `</div></div>`;
                }
            });
            container.innerHTML = html; lucide.createIcons();
        }

        function getStatusLabel(status) {
            const map = { 'AVAILABLE': 'Müsait', 'RESERVED': 'Rezerve', 'OCCUPIED': 'Dolu', 'CLEANING_REQUIRED': 'Temizlik', 'MAINTENANCE': 'Arızalı' };
            return map[status] || status;
        }

        function getIconForStatus(status) {
            const map = { 'AVAILABLE': 'check-circle', 'RESERVED': 'calendar-clock', 'OCCUPIED': 'user-check', 'CLEANING_REQUIRED': 'sparkles', 'MAINTENANCE': 'wrench' };
            return map[status] || 'home';
        }

        // ----------------------------------------------------------------
        // ODA İŞLEMLERİ (CHECK-IN / OUT)
        // ----------------------------------------------------------------
        window.openRoomDetails = (roomId) => {
            currentSelectedRoom = allRooms.find(r => r.id === roomId);
            if(!currentSelectedRoom) return;

            document.getElementById('modalRoomName').textContent = `Oda ${currentSelectedRoom.roomNumber}`;
            document.getElementById('modalRoomType').textContent = currentSelectedRoom.type;
            
            const badgeClasses = {
                'AVAILABLE': 'bg-emerald-50 border-emerald-200 text-emerald-800',
                'RESERVED': 'bg-blue-50 border-blue-200 text-blue-800',
                'OCCUPIED': 'bg-red-50 border-red-200 text-red-800',
                'CLEANING_REQUIRED': 'bg-amber-50 border-amber-200 text-amber-800',
                'MAINTENANCE': 'bg-orange-50 border-orange-200 text-orange-800'
            };

            document.getElementById('modalStatusBadge').className = `p-4 rounded-2xl border flex items-center gap-4 shadow-sm ${badgeClasses[currentSelectedRoom.status]}`;
            document.getElementById('modalStatusBadge').innerHTML = `
                <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 shadow-sm">
                    <i data-lucide="${getIconForStatus(currentSelectedRoom.status)}" class="w-6 h-6"></i>
                </div>
                <div><p class="text-[10px] uppercase font-bold tracking-wider opacity-70">Anlık Durum</p><p class="font-bold text-lg leading-tight">${getStatusLabel(currentSelectedRoom.status)}</p></div>
            `;

            let btns = '';
            if(currentSelectedRoom.status === 'AVAILABLE') {
                btns = `<button onclick="closeRoomModal(); openReservationModal('${roomId}')" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2 mb-2"><i data-lucide="plus-circle" class="w-5 h-5"></i> Yeni Rezervasyon</button>
                        <button onclick="updateRoomStatus('${roomId}', 'MAINTENANCE')" class="w-full bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl border border-slate-200">Arızaya Çek</button>`;
            } else if(currentSelectedRoom.status === 'RESERVED') {
                btns = `<button onclick="updateRoomStatus('${roomId}', 'OCCUPIED')" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/30 flex justify-center items-center gap-2 mb-2"><i data-lucide="log-in" class="w-5 h-5"></i> Müşteri Geldi (Check-in)</button>
                        <button onclick="updateRoomStatus('${roomId}', 'AVAILABLE')" class="w-full bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl border border-slate-200">İptal Et / Müsait Yap</button>`;
            } else if(currentSelectedRoom.status === 'OCCUPIED') {
                btns = `<button onclick="updateRoomStatus('${roomId}', 'CLEANING_REQUIRED')" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg shadow-slate-500/30 flex justify-center items-center gap-2"><i data-lucide="log-out" class="w-5 h-5"></i> Çıkış Yap (Check-out)</button>`;
            } else if(currentSelectedRoom.status === 'CLEANING_REQUIRED') {
                btns = `<div class="text-center p-3 text-sm text-amber-700 bg-amber-50 rounded-xl mb-3 font-medium">Kat görevlisi ekranından temizlendi bilgisi bekleniyor.</div>
                        <button onclick="updateRoomStatus('${roomId}', 'AVAILABLE')" class="w-full bg-white text-slate-600 font-bold py-3 rounded-xl border-2 border-slate-200">Zorla Müsait Yap</button>`;
            } else if(currentSelectedRoom.status === 'MAINTENANCE') {
                btns = `<button onclick="updateRoomStatus('${roomId}', 'AVAILABLE')" class="w-full bg-emerald-100 text-emerald-800 font-bold py-3.5 rounded-xl">Arıza Çözüldü (Müsait Yap)</button>`;
            }

            document.getElementById('modalActionButtons').innerHTML = btns;
            document.getElementById('roomModal').classList.remove('hidden'); document.getElementById('roomModal').classList.add('flex'); lucide.createIcons();
        };

        window.closeRoomModal = () => { document.getElementById('roomModal').classList.add('hidden'); document.getElementById('roomModal').classList.remove('flex'); };

        window.updateRoomStatus = async (roomId, newStatus) => {
            try { await updateDoc(doc(db, "rooms", roomId), { status: newStatus }); closeRoomModal(); showToast(`Oda: ${getStatusLabel(newStatus)}`); } 
            catch (e) { alert("Hata oluştu."); }
        };

        // ----------------------------------------------------------------
        // REZERVASYON (KAPORA & BAKİYE) LOGIC
        // ----------------------------------------------------------------
        window.openReservationModal = (roomId = null) => {
            document.getElementById('reservationModal').classList.remove('hidden'); document.getElementById('reservationModal').classList.add('flex');
            const today = new Date().toISOString().split('T')[0];
            const tmrw = new Date(); tmrw.setDate(tmrw.getDate() + 1);
            document.getElementById('resCheckIn').value = today; document.getElementById('resCheckOut').value = tmrw.toISOString().split('T')[0];
            if(roomId) { document.getElementById('resRoom').value = roomId; calculatePrice(); }
        };

        window.closeReservationModal = () => {
            document.getElementById('reservationModal').classList.add('hidden'); document.getElementById('reservationModal').classList.remove('flex');
            document.getElementById('reservationForm').reset(); document.getElementById('resRemaining').value = 0;
        };

        function populateReservationRoomSelect() {
            const select = document.getElementById('resRoom');
            const currentVal = select.value;
            let html = '<option value="">Önce oda seçin...</option>';
            
            allRooms.filter(r => r.status === 'AVAILABLE' || r.status === 'CLEANING_REQUIRED').forEach(room => {
                const aptName = allApartments.find(a => a.id === room.apartmentId)?.name || '';
                html += `<option value="${room.id}" data-price="${room.basePrice}">${aptName} - Oda ${room.roomNumber} (₺${room.basePrice})</option>`;
            });
            
            select.innerHTML = html;
            if(currentVal) select.value = currentVal;
            
            select.addEventListener('change', calculatePrice);
            document.getElementById('resCheckIn').addEventListener('change', calculatePrice);
            document.getElementById('resCheckOut').addEventListener('change', calculatePrice);
            document.getElementById('resPrice').addEventListener('input', updateRemaining);
            document.getElementById('resDeposit').addEventListener('input', updateRemaining);
        }

        function calculatePrice() {
            const select = document.getElementById('resRoom');
            const inD = new Date(document.getElementById('resCheckIn').value);
            const outD = new Date(document.getElementById('resCheckOut').value);
            if(!select.value || isNaN(inD) || isNaN(outD)) return;
            
            const diffDays = Math.ceil(Math.abs(outD - inD) / (1000 * 60 * 60 * 24));
            if(diffDays > 0) {
                const price = parseInt(select.options[select.selectedIndex].getAttribute('data-price') || 0);
                document.getElementById('resPrice').value = price * diffDays;
                updateRemaining();
            }
        }
        
        function updateRemaining() {
            const total = Number(document.getElementById('resPrice').value) || 0;
            const deposit = Number(document.getElementById('resDeposit').value) || 0;
            document.getElementById('resRemaining').value = Math.max(0, total - deposit);
        }

        window.submitReservation = async (e) => {
            e.preventDefault();
            const roomId = document.getElementById('resRoom').value;
            const name = document.getElementById('resName').value;
            const price = Number(document.getElementById('resPrice').value);
            const deposit = Number(document.getElementById('resDeposit').value);
            const remaining = Math.max(0, price - deposit);
            
            if(!roomId || !name || price <= 0) { showToast("Lütfen eksik alanları doldurun.", "error"); return; }
            
            e.currentTarget.disabled = true; e.currentTarget.innerHTML = 'Kaydediliyor...';

            try {
                // 1. Rezervasyon Kaydı
                await addDoc(collection(db, "reservations"), {
                    roomId: roomId, customerName: name, tc: document.getElementById('resTC').value, phone: document.getElementById('resPhone').value,
                    guests: document.getElementById('resGuests').value, checkInDate: document.getElementById('resCheckIn').value, checkOutDate: document.getElementById('resCheckOut').value,
                    totalPrice: price, paidAmount: deposit, remainingAmount: remaining, status: 'CONFIRMED', source: 'RECEPTION', createdAt: serverTimestamp()
                });

                // 2. Kasa Geliri (SADECE KAPORA VARSA)
                if (deposit > 0) {
                    const roomNo = allRooms.find(r => r.id === roomId)?.roomNumber || '';
                    await addDoc(collection(db, "finances"), {
                        type: 'INCOME', category: 'RESERVATION', amount: deposit, description: `${name} - Oda ${roomNo} (Kapora)`, addedBy: 'RECEPTION', createdAt: serverTimestamp()
                    });
                }

                // 3. Odayı Rezerve Yap
                await updateDoc(doc(db, "rooms", roomId), { status: 'RESERVED' });
                closeReservationModal(); showToast(deposit > 0 ? "Kayıt başarılı, kapora kasaya işlendi." : "Rezervasyon başarılı.");
            } catch (error) { showToast("Kayıt hatası.", "error"); } 
            finally { e.currentTarget.disabled = false; e.currentTarget.innerHTML = 'Kaydet ve Onayla'; }
        };

        // ----------------------------------------------------------------
        // GİDER EKLEME
        // ----------------------------------------------------------------
        window.openFinanceModal = () => { document.getElementById('financeModal').classList.remove('hidden'); document.getElementById('financeModal').classList.add('flex'); };
        window.closeFinanceModal = () => { document.getElementById('financeModal').classList.add('hidden'); document.getElementById('financeModal').classList.remove('flex'); document.getElementById('financeForm').reset(); };

        document.getElementById('financeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "finances"), {
                    type: 'EXPENSE', category: document.getElementById('finCategory').value, amount: Number(document.getElementById('finAmount').value),
                    description: document.getElementById('finDesc').value, addedBy: 'RECEPTION', createdAt: serverTimestamp()
                });
                closeFinanceModal(); showToast("Gider kasaya işlendi.");
            } catch(err) { showToast("Kayıt hatası.", "error"); }
        });

        // Utils
        window.showToast = (msg, type = 'success') => {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            const icon = document.getElementById('toastIcon');
            icon.setAttribute('data-lucide', type === 'error' ? 'alert-circle' : 'check-circle');
            icon.className = type === 'error' ? 'w-5 h-5 text-red-400' : 'w-5 h-5 text-emerald-400';
            lucide.createIcons();
            
            t.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('-translate-y-20', 'opacity-0'), 3000);
        };

    </script>
</body>
</html>
