<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resepsiyon Paneli | Sahra Apart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Modal Animation */
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Status Colors */
        .status-AVAILABLE { background-color: #def7ec; color: #03543f; border: 1px solid #31c48d; }
        .status-RESERVED { background-color: #e1effe; color: #1e429f; border: 1px solid #3f83f8; }
        .status-OCCUPIED { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f05252; }
        .status-CLEANING_REQUIRED { background-color: #fdf6b2; color: #723b13; border: 1px solid #e3a008; }
        .status-MAINTENANCE { background-color: #fcd9bd; color: #771d1d; border: 1px solid #ff8a4c; }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col h-full hidden md:flex">
        <div class="p-6 text-center border-b border-slate-700">
            <h1 class="text-2xl font-bold tracking-wider text-blue-400">SAHRA</h1>
            <p class="text-xs text-slate-400 uppercase mt-1">Resepsiyon Paneli</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white font-medium transition">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Oda Haritası
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-lg transition">
                <i data-lucide="calendar-check" class="w-5 h-5"></i> Rezervasyonlar
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-lg transition">
                <i data-lucide="users" class="w-5 h-5"></i> Konaklayanlar
            </a>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3 px-4 py-2">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center">
                    <i data-lucide="user" class="w-4 h-4 text-slate-300"></i>
                </div>
                <div>
                    <p class="text-sm font-medium">Resepsiyon</p>
                    <p class="text-xs text-green-400">Online</p>
                </div>
            </div>
            <a href="index.html" class="mt-4 flex items-center justify-center gap-2 w-full px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg transition">
                <i data-lucide="log-out" class="w-4 h-4"></i> Çıkış Yap
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Topbar -->
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
            <h2 class="text-xl font-semibold text-gray-800">Günlük Operasyon</h2>
            <div class="flex gap-3">
                <button onclick="openReservationModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> Yeni Rezervasyon
                </button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="bg-white border-b border-gray-200 p-4 shrink-0 flex gap-4 overflow-x-auto">
            <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="text-sm font-medium">Müsait: <span id="statAvailable">0</span></span>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                <span class="text-sm font-medium">Rezerve: <span id="statReserved">0</span></span>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <span class="text-sm font-medium">Dolu: <span id="statOccupied">0</span></span>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                <span class="text-sm font-medium">Temizlik: <span id="statCleaning">0</span></span>
            </div>
        </div>

        <!-- Room Map Area -->
        <div class="flex-1 overflow-y-auto p-6 bg-gray-50" id="roomMapContainer">
            <div class="text-center py-10 text-gray-500">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-3"></i>
                <p>Odalar yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Room Action Modal (Check-in/Out) -->
    <div id="roomModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md modal-enter">
            <div class="flex items-center justify-between p-5 border-b border-gray-100">
                <div>
                    <h3 class="text-lg font-bold text-gray-900" id="modalRoomName">Oda 101</h3>
                    <p class="text-sm text-gray-500" id="modalRoomType">Standart Oda</p>
                </div>
                <button onclick="closeRoomModal()" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <div class="p-4 rounded-lg bg-gray-50 border" id="modalStatusBadge">
                    <!-- Status will be injected here -->
                </div>
                
                <div id="modalActionButtons" class="grid grid-cols-2 gap-3 pt-2">
                    <!-- Buttons will be dynamic based on status -->
                </div>
            </div>
        </div>
    </div>

    <!-- Manual Reservation Modal -->
    <div id="reservationModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl modal-enter max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between p-5 border-b border-gray-100 shrink-0">
                <h3 class="text-lg font-bold text-gray-900">Hızlı Rezervasyon (Resepsiyon)</h3>
                <button onclick="closeReservationModal()" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto flex-1">
                <form id="reservationForm" class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Müşteri Adı Soyadı</label>
                            <input type="text" id="resName" required class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Telefon</label>
                            <input type="tel" id="resPhone" required class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Oda Seçimi</label>
                            <select id="resRoom" required class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                                <option value="">Oda seçin...</option>
                                <!-- JS will populate available rooms -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Misafir Sayısı</label>
                            <input type="number" min="1" value="2" id="resGuests" required class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Giriş Tarihi</label>
                            <input type="date" id="resCheckIn" required class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Çıkış Tarihi</label>
                            <input type="date" id="resCheckOut" required class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Toplam Fiyat (₺)</label>
                        <input type="number" id="resPrice" required class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border text-lg font-bold text-gray-900">
                    </div>
                </form>
            </div>
            <div class="p-5 border-t border-gray-100 bg-gray-50 shrink-0 flex justify-end gap-3 rounded-b-xl">
                <button onclick="closeReservationModal()" class="px-5 py-2 text-gray-600 font-medium hover:bg-gray-200 rounded-lg transition">İptal</button>
                <button onclick="submitReservation()" class="px-5 py-2 bg-blue-600 text-white font-medium hover:bg-blue-700 rounded-lg transition">Rezervasyonu Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50">
        <i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>
        <span id="toastMsg" class="font-medium">İşlem başarılı</span>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Your specific Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBL0xJ2-BS9o5QgG4AMb-s_xvt-Ai6nDm0",
            authDomain: "ekorkonaklama-web.firebaseapp.com",
            projectId: "ekorkonaklama-web",
            storageBucket: "ekorkonaklama-web.firebasestorage.app",
            messagingSenderId: "485785040258",
            appId: "1:485785040258:web:96e201063459beed388b9b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global State
        let allApartments = [];
        let allRooms = [];
        let currentSelectedRoom = null;

        // Initialize Icons
        lucide.createIcons();

        // -------------------------------------------------------------
        // REAL-TIME DATA FETCHING (Senkronizasyon)
        // -------------------------------------------------------------
        function listenToData() {
            // 1. Listen to Apartments
            onSnapshot(collection(db, "apartments"), (snapshot) => {
                allApartments = [];
                snapshot.forEach(doc => {
                    allApartments.push({ id: doc.id, ...doc.data() });
                });
                renderRoomMap();
            });

            // 2. Listen to Rooms
            onSnapshot(collection(db, "rooms"), (snapshot) => {
                allRooms = [];
                let stats = { AVAILABLE: 0, RESERVED: 0, OCCUPIED: 0, CLEANING_REQUIRED: 0 };
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allRooms.push({ id: doc.id, ...data });
                    if(stats[data.status] !== undefined) stats[data.status]++;
                });
                
                // Update top stats
                document.getElementById('statAvailable').textContent = stats.AVAILABLE;
                document.getElementById('statReserved').textContent = stats.RESERVED;
                document.getElementById('statOccupied').textContent = stats.OCCUPIED;
                document.getElementById('statCleaning').textContent = stats.CLEANING_REQUIRED;
                
                renderRoomMap();
                populateReservationRoomSelect();
            });
        }

        // -------------------------------------------------------------
        // RENDER ROOM MAP
        // -------------------------------------------------------------
        function renderRoomMap() {
            const container = document.getElementById('roomMapContainer');
            
            if (allApartments.length === 0 || allRooms.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500">
                    <i data-lucide="info" class="w-8 h-8 mx-auto mb-3"></i>
                    <p>Henüz sistemde kayıtlı apart veya oda bulunmuyor.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            let html = '';
            
            allApartments.forEach(apt => {
                const aptRooms = allRooms.filter(r => r.apartmentId === apt.id).sort((a,b) => a.roomNumber.localeCompare(b.roomNumber));
                
                if(aptRooms.length > 0) {
                    html += `
                    <div class="mb-8">
                        <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2">
                            <i data-lucide="building-2" class="w-5 h-5 text-gray-500"></i> ${apt.name}
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    `;
                    
                    aptRooms.forEach(room => {
                        const statusLabel = getStatusLabel(room.status);
                        html += `
                        <div onclick="window.openRoomDetails('${room.id}')" class="status-${room.status} rounded-xl p-4 cursor-pointer hover:shadow-md transition-shadow flex flex-col justify-between aspect-square">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-xl">${room.roomNumber}</span>
                                <i data-lucide="${getIconForStatus(room.status)}" class="w-5 h-5 opacity-80"></i>
                            </div>
                            <div>
                                <p class="text-xs opacity-80 mb-1 line-clamp-1">${room.type}</p>
                                <p class="text-sm font-semibold">${statusLabel}</p>
                            </div>
                        </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                }
            });
            
            container.innerHTML = html;
            lucide.createIcons();
        }

        // Helpers
        function getStatusLabel(status) {
            const map = {
                'AVAILABLE': 'Müsait',
                'RESERVED': 'Rezerve (Giriş Bekliyor)',
                'OCCUPIED': 'Dolu (Check-in yapıldı)',
                'CLEANING_REQUIRED': 'Temizlik Bekliyor',
                'MAINTENANCE': 'Arızalı / Bakımda'
            };
            return map[status] || status;
        }

        function getIconForStatus(status) {
            const map = {
                'AVAILABLE': 'check-circle',
                'RESERVED': 'calendar-clock',
                'OCCUPIED': 'user-check',
                'CLEANING_REQUIRED': 'sparkles',
                'MAINTENANCE': 'wrench'
            };
            return map[status] || 'home';
        }

        // -------------------------------------------------------------
        // ROOM DETAILS & ACTIONS (Check-in / Check-out)
        // -------------------------------------------------------------
        window.openRoomDetails = (roomId) => {
            currentSelectedRoom = allRooms.find(r => r.id === roomId);
            if(!currentSelectedRoom) return;

            document.getElementById('modalRoomName').textContent = `Oda ${currentSelectedRoom.roomNumber}`;
            document.getElementById('modalRoomType').textContent = currentSelectedRoom.type;
            
            const badge = document.getElementById('modalStatusBadge');
            badge.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="p-2 rounded-full bg-white shadow-sm">
                        <i data-lucide="${getIconForStatus(currentSelectedRoom.status)}" class="w-5 h-5 text-gray-700"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wide">Anlık Durum</p>
                        <p class="font-bold text-gray-900">${getStatusLabel(currentSelectedRoom.status)}</p>
                    </div>
                </div>
            `;

            // Dynamic Buttons Based on Status
            const btnContainer = document.getElementById('modalActionButtons');
            let btns = '';

            if(currentSelectedRoom.status === 'AVAILABLE') {
                btns = `
                    <button onclick="closeRoomModal(); openReservationModal('${roomId}')" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> Hemen Rezervasyon Yap
                    </button>
                    <button onclick="updateRoomStatus('${roomId}', 'MAINTENANCE')" class="col-span-2 bg-orange-100 hover:bg-orange-200 text-orange-800 font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition">
                        <i data-lucide="wrench" class="w-5 h-5"></i> Arızaya Çek
                    </button>
                `;
            } 
            else if(currentSelectedRoom.status === 'RESERVED') {
                btns = `
                    <button onclick="updateRoomStatus('${roomId}', 'OCCUPIED')" class="col-span-2 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition">
                        <i data-lucide="log-in" class="w-5 h-5"></i> Müşteri Geldi (Check-in)
                    </button>
                    <button onclick="updateRoomStatus('${roomId}', 'AVAILABLE')" class="col-span-2 bg-red-100 hover:bg-red-200 text-red-800 font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition">
                        İptal Et / Müsait Yap
                    </button>
                `;
            }
            else if(currentSelectedRoom.status === 'OCCUPIED') {
                btns = `
                    <button onclick="updateRoomStatus('${roomId}', 'CLEANING_REQUIRED')" class="col-span-2 bg-gray-800 hover:bg-gray-900 text-white font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition shadow-lg shadow-gray-300">
                        <i data-lucide="log-out" class="w-5 h-5"></i> Çıkış Yap (Check-out)
                    </button>
                `;
            }
            else if(currentSelectedRoom.status === 'CLEANING_REQUIRED') {
                btns = `
                    <div class="col-span-2 text-center p-3 text-sm text-amber-700 bg-amber-50 rounded-lg">
                        Kat görevlisi ekranından temizlendi bilgisi bekleniyor.
                    </div>
                    <button onclick="updateRoomStatus('${roomId}', 'AVAILABLE')" class="col-span-2 bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-700 font-medium py-2 rounded-lg transition mt-2">
                        Zorla Müsait Yap (Admin/Resepsiyon)
                    </button>
                `;
            }
            else if(currentSelectedRoom.status === 'MAINTENANCE') {
                 btns = `
                    <button onclick="updateRoomStatus('${roomId}', 'AVAILABLE')" class="col-span-2 bg-green-100 hover:bg-green-200 text-green-800 font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition">
                        <i data-lucide="check-circle" class="w-5 h-5"></i> Arıza Çözüldü (Müsait Yap)
                    </button>
                `;
            }

            btnContainer.innerHTML = btns;
            
            document.getElementById('roomModal').classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeRoomModal = () => {
            document.getElementById('roomModal').classList.add('hidden');
        };

        // Update Room Status Function
        window.updateRoomStatus = async (roomId, newStatus) => {
            try {
                const roomRef = doc(db, "rooms", roomId);
                await updateDoc(roomRef, {
                    status: newStatus
                });
                closeRoomModal();
                showToast(`Oda durumu güncellendi: ${getStatusLabel(newStatus)}`);
            } catch (error) {
                console.error("Hata:", error);
                alert("Durum güncellenirken hata oluştu.");
            }
        };

        // -------------------------------------------------------------
        // MANUAL RESERVATION LOGIC
        // -------------------------------------------------------------
        window.openReservationModal = (preselectRoomId = null) => {
            document.getElementById('reservationModal').classList.remove('hidden');
            
            // Set defaults (Today and Tomorrow)
            const today = new Date().toISOString().split('T')[0];
            const tmrw = new Date();
            tmrw.setDate(tmrw.getDate() + 1);
            const tomorrow = tmrw.toISOString().split('T')[0];
            
            document.getElementById('resCheckIn').value = today;
            document.getElementById('resCheckOut').value = tomorrow;

            if(preselectRoomId) {
                document.getElementById('resRoom').value = preselectRoomId;
                calculatePrice(); // Auto calc price if room is selected
            }
        };

        window.closeReservationModal = () => {
            document.getElementById('reservationModal').classList.add('hidden');
            document.getElementById('reservationForm').reset();
        };

        function populateReservationRoomSelect() {
            const select = document.getElementById('resRoom');
            const currentVal = select.value;
            
            let html = '<option value="">Oda seçin...</option>';
            const availableRooms = allRooms.filter(r => r.status === 'AVAILABLE' || r.status === 'CLEANING_REQUIRED');
            
            availableRooms.forEach(room => {
                const apt = allApartments.find(a => a.id === room.apartmentId);
                const aptName = apt ? apt.name : '';
                html += `<option value="${room.id}" data-price="${room.basePrice}">${aptName} - Oda ${room.roomNumber} (${room.type} - ₺${room.basePrice}/gece)</option>`;
            });
            
            select.innerHTML = html;
            if(currentVal) select.value = currentVal;
            
            // Add listener for auto price calc
            select.addEventListener('change', calculatePrice);
            document.getElementById('resCheckIn').addEventListener('change', calculatePrice);
            document.getElementById('resCheckOut').addEventListener('change', calculatePrice);
        }

        function calculatePrice() {
            const select = document.getElementById('resRoom');
            const checkIn = new Date(document.getElementById('resCheckIn').value);
            const checkOut = new Date(document.getElementById('resCheckOut').value);
            
            if(!select.value || isNaN(checkIn) || isNaN(checkOut)) return;
            
            const diffTime = Math.abs(checkOut - checkIn);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if(diffDays > 0) {
                const selectedOption = select.options[select.selectedIndex];
                const basePrice = parseInt(selectedOption.getAttribute('data-price') || 0);
                document.getElementById('resPrice').value = basePrice * diffDays;
            }
        }

        window.submitReservation = async () => {
            const roomId = document.getElementById('resRoom').value;
            const name = document.getElementById('resName').value;
            
            if(!roomId || !name) {
                alert("Lütfen zorunlu alanları doldurun.");
                return;
            }

            try {
                // 1. Create Reservation record (Simulation of Backend)
                await addDoc(collection(db, "reservations"), {
                    roomId: roomId,
                    customerName: name,
                    phone: document.getElementById('resPhone').value,
                    guests: document.getElementById('resGuests').value,
                    checkInDate: document.getElementById('resCheckIn').value,
                    checkOutDate: document.getElementById('resCheckOut').value,
                    totalPrice: document.getElementById('resPrice').value,
                    status: 'CONFIRMED', // Resepsiyondan yapıldığı için direkt onaylı
                    source: 'RECEPTION',
                    createdAt: serverTimestamp()
                });

                // 2. Change Room Status to RESERVED instantly (Central DB Logic)
                const roomRef = doc(db, "rooms", roomId);
                await updateDoc(roomRef, {
                    status: 'RESERVED'
                });

                closeReservationModal();
                showToast("Rezervasyon başarıyla oluşturuldu! Oda rezerve edildi.");
                
            } catch (error) {
                console.error("Kayıt Hatası:", error);
                alert("Rezervasyon oluşturulamadı.");
            }
        };

        // -------------------------------------------------------------
        // UI UTILS
        // -------------------------------------------------------------
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Initialize App
        listenToData();

    </script>
</body>
</html>
