<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resepsiyon Paneli | Sahra Apart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .status-AVAILABLE { background-color: #def7ec; color: #03543f; border: 1px solid #31c48d; }
        .status-RESERVED { background-color: #e1effe; color: #1e429f; border: 1px solid #3f83f8; }
        .status-OCCUPIED { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f05252; }
        .status-CLEANING_REQUIRED { background-color: #fdf6b2; color: #723b13; border: 1px solid #e3a008; }
        .status-MAINTENANCE { background-color: #fcd9bd; color: #771d1d; border: 1px solid #ff8a4c; }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col h-full hidden md:flex shrink-0">
        <div class="p-6 text-center border-b border-slate-700">
            <h1 class="text-2xl font-bold tracking-wider text-blue-400">SAHRA</h1>
            <p class="text-xs text-slate-400 uppercase mt-1">Resepsiyon Paneli</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('map')" id="navMapBtn" class="w-full flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white font-medium transition text-left">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Oda Haritası
            </button>
            <button onclick="switchTab('reservations')" id="navResBtn" class="w-full flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-lg transition text-left">
                <i data-lucide="calendar-check" class="w-5 h-5"></i> Rezervasyonlar
            </button>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3 px-4 py-2 mb-2">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center">
                    <i data-lucide="user" class="w-4 h-4 text-slate-300"></i>
                </div>
                <div>
                    <p class="text-sm font-medium truncate" id="staffEmailText">Resepsiyon</p>
                    <p class="text-xs text-green-400">Aktif Oturum</p>
                </div>
            </div>
            <a href="login.html" class="flex items-center justify-center gap-2 w-full px-4 py-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 text-sm rounded-lg transition font-medium">
                <i data-lucide="log-out" class="w-4 h-4"></i> Çıkış Yap
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <h2 class="text-xl font-semibold text-gray-800" id="pageTitleText">Merkezi Oda & Müsaitlik Haritası</h2>
            <button onclick="openReservationModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> Yeni Rezervasyon Gir
            </button>
        </header>

        <!-- TAB 1: ODA HARİTASI -->
        <div id="tabContentMap" class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Stats Bar -->
            <div class="bg-white border-b border-gray-200 p-4 shrink-0 flex gap-4 overflow-x-auto">
                <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="text-sm font-medium">Müsait: <span id="statAvailable">0</span></span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                    <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                    <span class="text-sm font-medium">Rezerve: <span id="statReserved">0</span></span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <span class="text-sm font-medium">Dolu: <span id="statOccupied">0</span></span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-md">
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <span class="text-sm font-medium">Temizlik: <span id="statCleaning">0</span></span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-8 bg-gray-50" id="roomMapContainer">
                <div class="text-center py-10 text-gray-400">Yükleniyor...</div>
            </div>
        </div>

        <!-- TAB 2: REZERVASYONLAR LİSTESİ (YENİ) -->
        <div id="tabContentReservations" class="flex-1 flex flex-col h-full overflow-hidden hidden bg-gray-50 p-8 overflow-y-auto">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-5 border-b border-gray-100 font-bold text-lg text-gray-800">
                    Web Sitesi ve Resepsiyon Rezervasyonları
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-gray-700 uppercase text-xs border-b">
                            <tr>
                                <th class="p-4">Misafir Adı</th>
                                <th class="p-4">İletişim / TC</th>
                                <th class="p-4">Oda</th>
                                <th class="p-4">Giriş / Çıkış</th>
                                <th class="p-4">Tutar</th>
                                <th class="p-4">Durum</th>
                            </tr>
                        </thead>
                        <tbody id="reservationsTableBody">
                            <tr><td colspan="6" class="p-6 text-center text-gray-400">Rezervasyonlar yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBL0xJ2-BS9o5QgG4AMb-s_xvt-Ai6nDm0",
            authDomain: "ekorkonaklama-web.firebaseapp.com",
            projectId: "ekorkonaklama-web",
            storageBucket: "ekorkonaklama-web.firebasestorage.app",
            messagingSenderId: "485785040258",
            appId: "1:485785040258:web:96e201063459beed388b9b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allRooms = [];
        let allApartments = [];

        // Tab Switcher
        window.switchTab = function(tab) {
            if(tab === 'map') {
                document.getElementById('tabContentMap').classList.remove('hidden');
                document.getElementById('tabContentReservations').classList.add('hidden');
                document.getElementById('navMapBtn').className = "w-full flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white font-medium transition text-left";
                document.getElementById('navResBtn').className = "w-full flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-lg transition text-left";
                document.getElementById('pageTitleText').textContent = "Merkezi Oda & Müsaitlik Haritası";
            } else {
                document.getElementById('tabContentMap').classList.add('hidden');
                document.getElementById('tabContentReservations').classList.remove('hidden');
                document.getElementById('navMapBtn').className = "w-full flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-lg transition text-left";
                document.getElementById('navResBtn').className = "w-full flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white font-medium transition text-left";
                document.getElementById('pageTitleText').textContent = "Rezervasyon Yönetimi";
            }
        }

        // Realtime Listeners
        function listenData() {
            onSnapshot(collection(db, "apartments"), (snap) => {
                allApartments = [];
                snap.forEach(d => allApartments.push({ id: d.id, ...d.data() }));
                renderMap();
            });

            onSnapshot(collection(db, "rooms"), (snap) => {
                allRooms = [];
                let stats = { AVAILABLE: 0, RESERVED: 0, OCCUPIED: 0, CLEANING_REQUIRED: 0 };
                snap.forEach(d => {
                    const data = d.data();
                    allRooms.push({ id: d.id, ...data });
                    if(stats[data.status] !== undefined) stats[data.status]++;
                });

                document.getElementById('statAvailable').textContent = stats.AVAILABLE;
                document.getElementById('statReserved').textContent = stats.RESERVED;
                document.getElementById('statOccupied').textContent = stats.OCCUPIED;
                document.getElementById('statCleaning').textContent = stats.CLEANING_REQUIRED;
                renderMap();
            });

            // Rezervasyonları Dinle
            onSnapshot(collection(db, "reservations"), (snap) => {
                let html = '';
                snap.forEach(d => {
                    const r = d.data();
                    const room = allRooms.find(room => room.id === r.roomId);
                    const roomNo = room ? room.roomNumber : 'Bilinmiyor';
                    const fullName = `${r.name || r.customerName || ''} ${r.surname || ''}`;

                    html += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4 font-bold text-gray-800">${fullName}</td>
                            <td class="p-4">
                                <p>${r.phone || '-'}</p>
                                <p class="text-xs text-gray-400">TC: ${r.tc || '-'}</p>
                            </td>
                            <td class="p-4 font-semibold text-blue-600">Oda ${roomNo}</td>
                            <td class="p-4 text-xs">
                                <p>Giriş: <strong>${r.checkin || r.checkInDate || '-'}</strong></p>
                                <p>Çıkış: <strong>${r.checkout || r.checkOutDate || '-'}</strong></p>
                            </td>
                            <td class="p-4 font-bold text-gray-900">${r.totalPrice || '-'}</td>
                            <td class="p-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold">REZERVE</span></td>
                        </tr>
                    `;
                });
                document.getElementById('reservationsTableBody').innerHTML = html || '<tr><td colspan="6" class="p-6 text-center text-gray-400">Henüz rezervasyon bulunmuyor.</td></tr>';
            });
        }

        function renderMap() {
            const container = document.getElementById('roomMapContainer');
            if (allApartments.length === 0 || allRooms.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400">Kayıtlı oda bulunmuyor.</div>`;
                return;
            }

            let html = '';
            allApartments.forEach(apt => {
                const aptRooms = allRooms.filter(r => r.apartmentId === apt.id).sort((a,b) => a.roomNumber.localeCompare(b.roomNumber));
                if(aptRooms.length > 0) {
                    html += `<div class="mb-8"><h3 class="font-bold text-gray-700 mb-3">${apt.name}</h3><div class="grid grid-cols-2 md:grid-cols-6 gap-4">`;
                    aptRooms.forEach(room => {
                        html += `
                        <div class="status-${room.status} rounded-2xl p-4 shadow-sm aspect-square flex flex-col justify-between border">
                            <span class="font-bold text-xl">${room.roomNumber}</span>
                            <div><p class="text-xs opacity-75">${room.type}</p><p class="text-xs font-bold">${room.status}</p></div>
                        </div>`;
                    });
                    html += `</div></div>`;
                }
            });
            container.innerHTML = html;
        }

        listenData();
        lucide.createIcons();
    </script>
</body>
</html>
