<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kat Görevlisi | Sahra Apart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Modal Animasyonu */
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Topbar -->
    <header class="bg-blue-600 text-white h-16 flex items-center justify-between px-4 shrink-0 shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                <i data-lucide="spray-can" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Görevli Paneli</h1>
                <p class="text-xs text-blue-200">Sahra Apart Kat Hizmetleri</p>
            </div>
        </div>
        <a href="index.html" class="p-2 bg-white/10 hover:bg-white/20 rounded-lg transition">
            <i data-lucide="log-out" class="w-5 h-5"></i>
        </a>
    </header>

    <!-- Stats Section -->
    <div class="bg-white px-4 py-4 border-b border-slate-200 shrink-0">
        <div class="flex justify-between items-center mb-2">
            <h2 class="font-semibold text-slate-700">Bugünkü Durum</h2>
            <span class="text-xs font-bold px-2 py-1 bg-blue-50 text-blue-600 rounded-full" id="dateText">Tarih</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-amber-50 border border-amber-100 rounded-xl p-3 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
                <div>
                    <p class="text-2xl font-bold text-amber-700 leading-none" id="statPending">0</p>
                    <p class="text-xs font-medium text-amber-600/80 mt-1">Bekleyen</p>
                </div>
            </div>
            <div class="bg-purple-50 border border-purple-100 rounded-xl p-3 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center shrink-0">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <p class="text-2xl font-bold text-purple-700 leading-none" id="statCleaning">0</p>
                    <p class="text-xs font-medium text-purple-600/80 mt-1">Temizlenen</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Task List -->
    <main class="flex-1 overflow-y-auto p-4 bg-slate-50" id="taskListContainer">
        <!-- Loader -->
        <div class="flex flex-col items-center justify-center h-full text-slate-400">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-3 text-blue-500"></i>
            <p class="font-medium text-sm">Görevler yükleniyor...</p>
        </div>
    </main>

    <!-- ARIZA BİLDİRİM MODALI -->
    <div id="issueModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm">
        <div class="bg-white w-full sm:w-[400px] sm:rounded-2xl rounded-t-2xl shadow-2xl modal-enter overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i> Arıza Bildir
                </h3>
                <button onclick="closeIssueModal()" class="p-2 text-slate-400 hover:text-slate-600 bg-white rounded-full shadow-sm">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-5">
                <p class="text-sm text-slate-600 mb-4">Seçili oda: <strong id="issueRoomName" class="text-slate-900"></strong></p>
                <input type="hidden" id="issueRoomId">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Arıza Kategorisi</label>
                        <select id="issueCategory" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-slate-50">
                            <option value="Klima">Klima Problemi</option>
                            <option value="Su/Tesisat">Su / Tesisat</option>
                            <option value="Elektrik">Elektrik / Aydınlatma</option>
                            <option value="Mobilya">Mobilya / Eşya Hasarı</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kısa Açıklama (İsteğe Bağlı)</label>
                        <textarea id="issueDesc" rows="2" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-slate-50 resize-none" placeholder="Ne çalışmıyor?"></textarea>
                    </div>
                </div>
                
                <button onclick="submitIssue()" class="w-full mt-6 bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-500/30 flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i> Arıza Kaydını Gönder
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Bildirimi -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 transform -translate-y-10 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <div class="bg-slate-900/90 backdrop-blur text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700">
            <i data-lucide="check-circle" id="toastIcon" class="w-5 h-5 text-emerald-400"></i>
            <span id="toastMsg" class="font-medium text-sm">İşlem başarılı</span>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Firebase Config (Sizin projeniz)
        const firebaseConfig = {
            apiKey: "AIzaSyBL0xJ2-BS9o5QgG4AMb-s_xvt-Ai6nDm0",
            authDomain: "ekorkonaklama-web.firebaseapp.com",
            projectId: "ekorkonaklama-web",
            storageBucket: "ekorkonaklama-web.firebasestorage.app",
            messagingSenderId: "485785040258",
            appId: "1:485785040258:web:96e201063459beed388b9b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allApartments = [];
        let allRooms = [];

        // UI Setup
        lucide.createIcons();
        document.getElementById('dateText').textContent = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });

        // Veri Dinleme
        function listenToData() {
            onSnapshot(collection(db, "apartments"), (snapshot) => {
                allApartments = [];
                snapshot.forEach(doc => allApartments.push({ id: doc.id, ...doc.data() }));
                renderTasks();
            });

            onSnapshot(collection(db, "rooms"), (snapshot) => {
                allRooms = [];
                let pendingCount = 0;
                let cleaningCount = 0;
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allRooms.push({ id: doc.id, ...data });
                    
                    if (data.status === 'CLEANING_REQUIRED') pendingCount++;
                    if (data.status === 'CLEANING') cleaningCount++;
                });
                
                document.getElementById('statPending').textContent = pendingCount;
                document.getElementById('statCleaning').textContent = cleaningCount;
                
                renderTasks();
            });
        }

        // Görevleri Ekrana Çizme
        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            
            // Sadece Temizlik Bekleyen veya Temizlenen odaları filtrele
            const taskRooms = allRooms.filter(r => r.status === 'CLEANING_REQUIRED' || r.status === 'CLEANING');

            if (taskRooms.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 mt-10">
                        <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mb-4">
                            <i data-lucide="check" class="w-10 h-10 text-emerald-500"></i>
                        </div>
                        <p class="font-bold text-lg text-slate-700 mb-1">Harika İş!</p>
                        <p class="text-sm text-center">Şu an için bekleyen bir temizlik<br>görevi bulunmuyor.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // Odaları apartlara ve oda numaralarına göre sırala
            taskRooms.sort((a, b) => a.roomNumber.localeCompare(b.roomNumber));

            let html = '<div class="space-y-4 pb-10">';
            
            taskRooms.forEach(room => {
                const apt = allApartments.find(a => a.id === room.apartmentId);
                const aptName = apt ? apt.name : 'Bilinmeyen Apart';
                const isCleaning = room.status === 'CLEANING';

                html += `
                <div class="bg-white rounded-2xl p-4 shadow-sm border ${isCleaning ? 'border-purple-200 shadow-purple-100' : 'border-amber-200 shadow-amber-100'} transition-all">
                    
                    <!-- Kart Başlığı -->
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
                                <i data-lucide="building-2" class="w-3.5 h-3.5"></i> ${aptName}
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800">Oda ${room.roomNumber}</h3>
                        </div>
                        <div class="px-3 py-1.5 rounded-lg text-xs font-bold ${isCleaning ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'} flex items-center gap-1">
                            <i data-lucide="${isCleaning ? 'loader-2' : 'alert-circle'}" class="w-3.5 h-3.5 ${isCleaning ? 'animate-spin' : ''}"></i>
                            ${isCleaning ? 'TEMİZLENİYOR' : 'BEKLİYOR'}
                        </div>
                    </div>

                    <!-- Aksiyon Butonları -->
                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <button onclick="openIssueModal('${room.id}', '${room.roomNumber}')" class="px-4 py-3.5 rounded-xl border-2 border-slate-100 text-slate-600 font-semibold hover:bg-slate-50 flex items-center justify-center gap-2 transition active:scale-95">
                            <i data-lucide="alert-triangle" class="w-5 h-5"></i> Arıza
                        </button>
                        
                        ${isCleaning 
                        ? `<button onclick="updateRoomStatus('${room.id}', 'AVAILABLE', 'Oda temizlendi, müsait duruma alındı.')" class="px-4 py-3.5 rounded-xl bg-emerald-500 text-white font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30 transition active:scale-95">
                                <i data-lucide="check-square" class="w-5 h-5"></i> Temizliği Bitir
                           </button>` 
                        : `<button onclick="updateRoomStatus('${room.id}', 'CLEANING', 'Temizlik işlemi başlatıldı.')" class="px-4 py-3.5 rounded-xl bg-purple-600 text-white font-bold flex items-center justify-center gap-2 shadow-lg shadow-purple-500/30 transition active:scale-95">
                                <i data-lucide="play" class="w-5 h-5"></i> Başla
                           </button>`
                        }
                    </div>
                </div>`;
            });
            
            html += '</div>';
            container.innerHTML = html;
            lucide.createIcons();
        }

        // Firebase Güncelleme Fonksiyonu
        window.updateRoomStatus = async (roomId, newStatus, successMsg) => {
            try {
                const roomRef = doc(db, "rooms", roomId);
                await updateDoc(roomRef, { status: newStatus });
                showToast(successMsg, 'success');
            } catch (error) {
                console.error("Hata:", error);
                showToast("Durum güncellenirken bir hata oluştu.", 'error');
            }
        };

        // Arıza Modalı İşlemleri
        window.openIssueModal = (roomId, roomNumber) => {
            document.getElementById('issueRoomId').value = roomId;
            document.getElementById('issueRoomName').textContent = `Oda ${roomNumber}`;
            document.getElementById('issueDesc').value = '';
            document.getElementById('issueModal').classList.remove('hidden');
            document.getElementById('issueModal').classList.add('flex');
        };

        window.closeIssueModal = () => {
            document.getElementById('issueModal').classList.add('hidden');
            document.getElementById('issueModal').classList.remove('flex');
        };

        window.submitIssue = async () => {
            const roomId = document.getElementById('issueRoomId').value;
            const category = document.getElementById('issueCategory').value;
            const desc = document.getElementById('issueDesc').value;
            
            const btn = event.currentTarget;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Gönderiliyor...`;
            lucide.createIcons();

            try {
                // Arızayı Maintenance koleksiyonuna yaz (Opsiyonel ama iyi pratik)
                await addDoc(collection(db, "maintenanceTickets"), {
                    roomId: roomId,
                    category: category,
                    description: desc,
                    status: 'OPEN',
                    createdAt: serverTimestamp()
                });

                // Oda durumunu "BAKIMDA" (MAINTENANCE) olarak güncelle
                const roomRef = doc(db, "rooms", roomId);
                await updateDoc(roomRef, { status: 'MAINTENANCE' });
                
                closeIssueModal();
                showToast("Arıza bildirildi ve oda bakıma alındı.", 'error'); // error tipini kırmızı göstermek için kullanıyoruz
            } catch (error) {
                console.error("Hata:", error);
                showToast("Arıza bildirilirken hata oluştu.", 'error');
            } finally {
                btn.innerHTML = originalHtml;
                lucide.createIcons();
            }
        };

        // Toast Gösterici
        window.showToast = (message, type = 'success') => {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            
            document.getElementById('toastMsg').textContent = message;
            
            if(type === 'success') {
                icon.setAttribute('data-lucide', 'check-circle');
                icon.className = "w-5 h-5 text-emerald-400";
            } else {
                icon.setAttribute('data-lucide', 'alert-circle');
                icon.className = "w-5 h-5 text-red-400";
            }
            lucide.createIcons();

            toast.classList.remove('-translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-10', 'opacity-0');
            }, 3000);
        };

        // Başlangıç
        listenToData();

    </script>
</body>
</html>
