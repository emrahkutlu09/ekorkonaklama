<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Girişi | Sahra Apart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30">
                <i data-lucide="building-2" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Sahra Apart</h1>
            <p class="text-sm text-slate-500 mt-1">Personel ve Yönetim Girişi</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">E-Posta Adresi</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                    <input type="email" id="loginEmail" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-700" placeholder="ornek@sahra.com">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Şifre</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                    <input type="password" id="loginPassword" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-700" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-slate-900/20 flex items-center justify-center gap-2 mt-2">
                Sisteme Giriş Yap
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Müşteri Ana Sayfasına Dön
            </a>
        </div>
    </div>

    <!-- Toast / Alert Message -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4 bg-red-600 text-white">
        <i data-lucide="alert-circle" id="toastIcon" class="w-5 h-5"></i>
        <span id="toastMsg" class="font-medium text-sm">Hata mesajı</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBL0xJ2-BS9o5QgG4AMb-s_xvt-Ai6nDm0",
            authDomain: "ekorkonaklama-web.firebaseapp.com",
            projectId: "ekorkonaklama-web",
            storageBucket: "ekorkonaklama-web.firebasestorage.app",
            messagingSenderId: "485785040258",
            appId: "1:485785040258:web:96e201063459beed388b9b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        lucide.createIcons();

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.remove('-translate-y-4', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                t.classList.add('-translate-y-4', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = document.getElementById('submitBtn');

            btn.innerHTML = 'Giriş yapılıyor...';
            btn.disabled = true;

            try {
                // 1. Firebase Auth ile giriş yap
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 2. Firestore'daki 'staff' koleksiyonundan personelin rolünü bul
                const q = query(collection(db, "staff"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                let userRole = 'RECEPTION'; // Varsayılan
                if (!querySnapshot.empty) {
                    userRole = querySnapshot.docs[0].data().role;
                } else {
                    // Eğer staff tablosunda yoksa ama e-posta admin ise admin yapabiliriz
                    userRole = 'ADMIN';
                }

                // 3. Role göre doğru panele yönlendir
                showToast("Giriş başarılı, yönlendiriliyorsunuz...");
                setTimeout(() => {
                    if (userRole === 'HOUSEKEEPING') {
                        window.location.href = 'katgorevlisi.html';
                    } else {
                        window.location.href = 'resepsiyon.html';
                    }
                }, 1000);

            } catch (err) {
                console.error("Giriş hatası:", err);
                showToast("E-posta veya şifre hatalı!");
                btn.innerHTML = 'Sisteme Giriş Yap';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
